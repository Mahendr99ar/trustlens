[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trustlens-ml"
version = "0.1.0"
description = "Detect AI-written product reviews and summarise genuine customer opinion by aspect"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.1", "transformers>=4.44", "datasets>=2.19", "scikit-learn>=1.3", "pandas>=2.0", "pyarrow>=14",
         "requests>=2.31", "accelerate>=0.30", "onnx>=1.15", "onnxscript>=0.1", "onnxruntime>=1.17", "huggingface_hub>=0.23"]

[tool.setuptools]
packages = ["trustlens_ml"]

[tool.setuptools.package-data]
trustlens_ml = ["aspects.json"]
